name: Check AWS credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      - name: Verify AWS identity and S3 list access
        shell: bash
        env:
          EXPECTED_AWS_ACCOUNT_ID: "891105707975"
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text 2>/dev/null)" || {
            echo "::error::AWS authentication failed. Check the GitHub secrets and IAM access key status."
            exit 1
          }

          if [[ "$account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::Credentials authenticated to an unexpected AWS account."
            exit 1
          fi

          if ! aws s3api list-objects-v2 \
            --bucket insurance360-bucket \
            --prefix dev/ \
            --max-keys 1 \
            >/dev/null 2>&1; then
            echo "::error::AWS credentials are valid, but S3 list access to the dev/ prefix failed."
            exit 1
          fi

          echo "AWS credentials and S3 list access verified."
